name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-checks:
    name: Syntax checks (Python, shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile app, bridge, and test modules
        run: python -m py_compile app/*.py bridge/*.py tests/*.py

      - name: Shell syntax check
        run: |
          for f in tests/*.sh autocommit/*.sh unraid/*.sh .github/scripts/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

  version:
    name: Version is new and consistent
    runs-on: ubuntu-latest
    # Every PR must ship a version that has never been released: app/main.py's
    # version= must not already be a tag of either image on Docker Hub, nor a
    # git tag vX.Y.Z, and docker-compose.yml / unraid/deploy.sh must match it.
    # On a push to main only the consistency half runs -- once a release is
    # published, main's version is "taken" until the next PR bumps it.
    # .github/scripts/check-version.sh holds the logic; the release workflow
    # (.github/workflows/release.yml) runs the same script before it pushes.
    steps:
      - uses: actions/checkout@v4

      - name: PR version has never been published
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/check-version.sh unpublished

      - name: Version strings agree
        if: github.event_name != 'pull_request'
        run: bash .github/scripts/check-version.sh consistent

  containment-suite:
    name: API containment & functional suite (both container modes)
    needs: quick-checks
    runs-on: ubuntu-latest
    # tests/run_tests.sh builds the image twice (WITH_MCP=1 and WITH_MCP=0),
    # runs it under two mount configurations, and drives both
    # tests/escape_suite.py (REST) and tests/mcp_escape_suite.py (/mcp) against
    # each -- see that script for what "both modes" means and why both must
    # pass independently of the mount boundary.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # For tests/bridge_tests.py's optional test 17 (a real stdio
      # initialize + tools/list handshake against `serve` mode) -- every
      # other bridge test imports the module directly and needs nothing
      # installed. Installed on the runner, not in the image: the bridge is
      # client-side code and never runs inside the container under test.
      - name: Install bridge/requirements.txt (for the optional stdio test)
        run: pip install -r bridge/requirements.txt

      - name: Run tests/run_tests.sh
        run: bash tests/run_tests.sh

  autocommit-suite:
    name: Autocommit sidecar suite
    needs: quick-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the autocommit sidecar image
        run: docker build -t claude-files-autocommit:test ./autocommit

      - name: Run tests/autocommit_tests.sh
        run: bash tests/autocommit_tests.sh

  git-tools:
    name: Git tools and extensions (in-process)
    needs: quick-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # One pip invocation, not two: mcp and fastapi share starlette (see the
      # Dockerfile and docs/plan-mcp-connector.md).
      - name: Install app requirements
        run: pip install -r app/requirements.txt -r app/requirements-mcp.txt

      # app.git_ops against throwaway repositories with a bare-repo remote:
      # the scope boundary, the opt-in rule, planted hooks and config, startup
      # refusals, credential scrubbing, timeouts. Reaches the remote over git's
      # file transport through test-only seams (production allows only ssh and
      # https); the container-level run in tests/run_tests.sh covers the image.
      - name: tests/git_suite.py
        run: python3 tests/git_suite.py

      # The same tools through /mcp and REST: tool registration for each
      # ENABLE_GIT_READ x ENABLE_GIT_WRITE combination, token scopes, error
      # mapping, uploads-in-flight, and a bad deployment refusing to start.
      - name: tests/git_surface_tests.py
        run: python3 tests/git_surface_tests.py

      # EXTRA_TOOL_MODULES (docs/extensions.md): extension tools through /mcp,
      # the read-only gate on read_only=False tools, Vault containment for
      # extension file access, and every broken extension refusing to start.
      - name: tests/extension_tests.py
        run: python3 tests/extension_tests.py
