name: Release

# Pushing a version tag publishes both images to the GitHub Container Registry:
#
#   ghcr.io/<owner>/claude-files
#   ghcr.io/<owner>/claude-files-autocommit
#
# Cutting a release (README.md, "Releases"):
#   1. Set the new version in app/main.py, bridge/claude_files_bridge.py and
#      both image pins in docker-compose.yml.
#   2. Merge that, then tag the merge commit and push the tag:
#        git tag v1.2.0 && git push origin v1.2.0
#      Creating a GitHub Release with a new v* tag from the web UI works too.
#
# Nothing is published unless the tag matches the version in the code and the
# full CI suite passes on the tagged commit.

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version-check:
    name: Tag matches the version in the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the tag with every place the version is written
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          want="${tag#v}"
          fail=0
          check() {  # check <what> <file> <found>
            if [[ "$3" == "$want" ]]; then
              echo "ok    $1 = $3"
            else
              echo "::error file=$2::$1 is '${3:-<not found>}', but the tag $tag needs $want"
              fail=1
            fi
          }
          check "app version" app/main.py \
            "$(sed -nE 's/^ +version="([^"]+)",$/\1/p' app/main.py | head -1)"
          check "bridge User-Agent" bridge/claude_files_bridge.py \
            "$(sed -nE 's#^USER_AGENT = "claude-files-bridge/([^"]+)"$#\1#p' bridge/claude_files_bridge.py)"
          for image in claude-files claude-files-autocommit; do
            check "docker-compose.yml $image pin" docker-compose.yml \
              "$(sed -nE "s#^ +image: ghcr\.io/[^/]+/${image}:([^[:space:]]+)\$#\1#p" docker-compose.yml)"
          done
          exit "$fail"

  tests:
    name: CI
    needs: version-check
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.image }}
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: claude-files
            context: .
            description: REST and MCP file API confined to a single shared folder
          - image: claude-files-autocommit
            context: ./autocommit
            description: Polls a git repository (or one folder of it) and commits and pushes changes
    env:
      # Put the OCI annotations on the multi-arch index too. GHCR reads the
      # package description from the index, not from the per-arch images.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@v4

      # Registry paths must be lowercase; GitHub owner names often aren't.
      - name: Image name
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 -> 1.2.3, 1.2, 1, latest. A pre-release such as v1.3.0-rc.1
      # gets only its own exact tag and never moves 1.3, 1 or latest.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.ref }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
