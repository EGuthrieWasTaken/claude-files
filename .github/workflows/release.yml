name: Release

# Publishing a GitHub release tagged vX.Y.Z builds both images for
# linux/amd64 and linux/arm64 and pushes them to Docker Hub as :X.Y.Z, plus
# :latest unless the release is marked as a pre-release. The tag must equal
# app/main.py's version (see .github/scripts/check-version.sh), and a release
# never overwrites a tag that is already on Docker Hub.
#
# Needs two repository secrets: DOCKERHUB_USERNAME, and DOCKERHUB_TOKEN (a
# Docker Hub access token with Read & Write scope).

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NAMESPACE: eguthriewastaken2

jobs:
  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Tag matches app/main.py and is not yet on Docker Hub
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: bash .github/scripts/check-version.sh release "$TAG"

      - name: Work out image tags
        id: tags
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          v=$(bash .github/scripts/check-version.sh print)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          for img in claude-files claude-files-autocommit; do
            tags="${NAMESPACE}/${img}:${v}"
            if [[ "$PRERELEASE" != "true" ]]; then
              tags="${tags},${NAMESPACE}/${img}:latest"
            fi
            echo "${img//-/_}=${tags}" >> "$GITHUB_OUTPUT"
          done

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push claude-files
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.claude_files }}
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push claude-files-autocommit
        uses: docker/build-push-action@v6
        with:
          context: ./autocommit
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.claude_files_autocommit }}
          labels: |
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Both architectures landed under one tag
        env:
          V: ${{ steps.tags.outputs.version }}
        run: |
          for img in claude-files claude-files-autocommit; do
            docker buildx imagetools inspect "${NAMESPACE}/${img}:${V}" | tee /tmp/inspect.txt
            grep -q "linux/amd64" /tmp/inspect.txt && grep -q "linux/arm64" /tmp/inspect.txt \
              || { echo "::error::${NAMESPACE}/${img}:${V} is missing an architecture"; exit 1; }
          done
