services:
  claude-files:
    image: ghcr.io/eguthriewastaken/claude-files:1.4.0
    # Uncomment to build from source instead of pulling:
    # build: .
    container_name: claude-files
    restart: unless-stopped

    # ------------------------------------------------------------------
    # THE containment boundary. Bind-mount ONLY the subfolder you want
    # exposed. The rest of the repository is not in the container's mount
    # namespace, so no bug in the API can reach it.
    #
    #   left side  = the subfolder on the host  <-- change this
    #   right side = always /data
    # ------------------------------------------------------------------
    volumes:
      - /srv/repos/myrepo/shared:/data
      # GIT TOOLS (ENABLE_GIT_READ/WRITE), subfolder layout. Replace the line
      # above with these, so git can see the repository but the KERNEL still
      # stops anything except .git and the shared folder from being written:
      #   - /srv/repos/myrepo:/repo:ro
      #   - /srv/repos/myrepo/.git:/repo/.git
      #   - /srv/repos/myrepo/shared:/repo/shared
      #   - /srv/keys/deploy_ed25519:/keys/id_ed25519:ro
      #   - /srv/keys/known_hosts:/keys/known_hosts:ro
      # and set DATA_ROOT=/repo/shared, GIT_REPO_ROOT=/repo (below). Use a
      # deploy key scoped to this one repository.

    environment:
      # openssl rand -hex 32
      API_TOKEN: "${API_TOKEN:?set API_TOKEN in .env}"
      # Optional second token that can read but not write.
      API_TOKEN_READONLY: "${API_TOKEN_READONLY:-}"
      MAX_UPLOAD_BYTES: "268435456"      # 256 MiB
      DENIED_NAMES: ".git,.gitmodules,.ssh"
      ALLOW_DELETE: "true"
      ALLOW_HARDLINKED_FILES: "false"
      ENABLE_DOCS: "true"
      REQUIRE_MOUNT: "true"     # refuse to start if /data is not a bind mount
      RATE_LIMIT_PER_MINUTE: "600"
      LOG_LEVEL: "INFO"

      # -- Optional MCP connector (see README.md, "MCP connector") --------
      ENABLE_MCP: "true"        # mount /mcp; set false to disable at runtime
      # This service's public hostname, e.g. files.example.com. Used only to
      # allow-list the Host header the MCP SDK's DNS-rebinding guard checks;
      # left blank, that guard is disabled rather than 421ing every request
      # through your reverse proxy or tunnel. /mcp is still gated by
      # API_TOKEN either way.
      MCP_PUBLIC_HOSTNAME: "${MCP_PUBLIC_HOSTNAME:-}"
      # Base URL for the one-time upload/download links (request_upload /
      # request_download). Unset: https://$MCP_PUBLIC_HOSTNAME, else the
      # request's forwarded host.
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      MCP_INLINE_LIMIT_CHARS: "100000"    # read_file's inline text budget
      MCP_BASE64_LIMIT_BYTES: "8192"      # write_file's single-shot base64 cap (advisory); over
                                           # it, write_file refuses and names begin_write
      MCP_UPLOAD_SESSION_TTL_SECONDS: "900"   # begin_write session idle timeout
      MCP_MAX_CONCURRENT_UPLOADS: "8"         # cap on open chunked-upload sessions
      MCP_UPLOAD_CHUNK_ADVISORY_BYTES: "3072" # suggested write_chunk size (advisory only)
      # true ONLY while the autocommit service below commits this folder: the
      # connector then tells agents their writes are committed and pushed
      # automatically. false makes no claim about git. Set it in .env; ignored
      # when ENABLE_GIT_WRITE is on (the agent commits by itself then).
      AUTOCOMMIT_NOTICE: "${AUTOCOMMIT_NOTICE:-false}"

      # -- Optional git tools (docs/plan-mcp-git-ops.md) ---------------------
      # Off by default. To turn them on, ALSO change the volumes above to the
      # three-mount layout described in the comment on `volumes:` -- the repo
      # root read-only, with only .git and the shared folder writable -- and
      # mount a deploy key. Nothing here commits or pushes on its own; the
      # agent calls git_commit / git_push itself.
      ENABLE_GIT_READ: "false"     # git_status, git_log, git_diff   (ro token ok)
      ENABLE_GIT_WRITE: "false"    # git_commit/pull/push/merge/fetch (rw token)
      # GIT_REPO_ROOT: "/repo"                  # where the repo root is mounted
      # DATA_ROOT: "/repo/sub-folder-1"         # the agent's folder = its write scope
      # GIT_REMOTE: "origin"
      # GIT_BRANCH: "main"
      # SSH_KEY_PATH: "/keys/id_ed25519"
      # SSH_KNOWN_HOSTS_PATH: "/keys/known_hosts"   # required with a key; no trust-on-first-use
      # GIT_PULL_OUTSIDE_SCOPE: "false"         # needs the repo root mounted read-write

    # Files the API writes are owned by this uid:gid, and the shared folder
    # must be writable by it. Set PUID/PGID in .env to match the folder's
    # owner (on unRAID: 99 and 100, nobody:users). For the git tools over
    # ssh, use 1000 or 99: those are the uids the image has passwd entries
    # for, and OpenSSH refuses to run without one.
    user: "${PUID:-1000}:${PGID:-1000}"

    ports:
      - "8080:8080"

    # ------------------------------------------------------------------
    # Hardening. Each line removes a way out of the container.
    # ------------------------------------------------------------------
    read_only: true                      # rootfs is immutable; only /data is writable
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL                              # no CAP_DAC_OVERRIDE, no CAP_SYS_ADMIN
    security_opt:
      - no-new-privileges:true           # setuid binaries cannot escalate
    pids_limit: 200
    mem_limit: 512m

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ------------------------------------------------------------------------
  # Optional sidecar: commits and pushes whatever the API writes.
  #
  # Note the asymmetry with the service above. This one mounts the REPO ROOT,
  # because it needs .git to make a commit. Its containment is different in
  # kind: SUBDIR scopes every `git add`, so it can only ever commit the same
  # folder the API can write. Anything else in the working tree is left alone.
  #
  # When you run it, set AUTOCOMMIT_NOTICE=true in .env and recreate the API
  # (`docker compose up -d claude-files`), so the MCP connector tells agents
  # that what they write is committed and pushed.
  # ------------------------------------------------------------------------
  autocommit:
    image: ghcr.io/eguthriewastaken/claude-files-autocommit:1.4.0
    # build: ./autocommit
    container_name: claude-files-autocommit
    restart: unless-stopped
    depends_on:
      - claude-files

    volumes:
      # The repo root -- .git is required to commit.
      - /srv/repos/myrepo:/repo
      # A deploy key with write access to this one repo, read-only to us.
      - /srv/keys/deploy_ed25519:/keys/id_ed25519:ro
      - /srv/keys/known_hosts:/keys/known_hosts:ro

    environment:
      REPO_PATH: "/repo"
      # Must match the folder claude-files exposes, relative to the repo root.
      # "." commits the whole repository (general-purpose autocommit mode).
      SUBDIR: "shared"
      INTERVAL: "120"
      QUIET_PERIOD: "30"
      GIT_BRANCH: "main"
      GIT_AUTHOR_NAME: "claude-files autocommit"
      GIT_AUTHOR_EMAIL: "autocommit@localhost"
      COMMIT_PREFIX: "agent: sync"
      MAX_CHANGED_FILES: "1000"
      SSH_KEY_PATH: "/keys/id_ed25519"
      SSH_KNOWN_HOSTS_PATH: "/keys/known_hosts"
      PUSH: "true"

    # Same uid:gid as the API above, so the two agree on file ownership.
    user: "${PUID:-1000}:${PGID:-1000}"

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
